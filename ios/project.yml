# Xcode project spec. Generate the project with: brew install xcodegen && xcodegen generate
name: ECE343
options:
  bundleIdPrefix: io.github.jellis-87
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ECE343:
    type: application
    platform: iOS
    sources:
      - path: ECE343
      # The offline web bundle (widgets, MathJax, fonts, content.json), copied in as www/.
      - path: ../web/www
        type: folder
        buildPhase: resources
    info:
      path: ECE343/Info.plist
      properties:
        CFBundleDisplayName: Electromagnetics
        UILaunchScreen:
          UIColorName: PageBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jellis-87.ece343
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - ECE343Tests
  ECE343Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ECE343Tests
    dependencies:
      - target: ECE343
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
