name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the web bundle from content/
        run: python3 tools/build_web.py
      - name: Fail if the committed bundle differs
        run: git diff --exit-code -- web/

  ios:
    name: iOS build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devs if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for k in reversed(ios) for d in devs[k] if d["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project ECE343.xcodeproj -scheme ECE343 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning:|Test Case|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log || { tail -150 build.log; exit 1; }
      # A Release build for the iOS Simulator, zipped for Appetize.io (browser simulator).
      # Both architectures so it runs on Intel and Apple-silicon simulator hosts.
      - name: Build for the simulator (Appetize)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project ECE343.xcodeproj -scheme ECE343 -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- \
            | tee sim.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" sim.log || { tail -150 sim.log; exit 1; }
          app=build/Build/Products/Release-iphonesimulator/ECE343.app
          lipo -info "$app/ECE343"
          ditto -c -k --sequesterRsrc --keepParent "$app" ECE343-simulator.zip
      - name: Upload the simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ECE343-simulator-${{ github.sha }}
          path: ios/ECE343-simulator.zip
          retention-days: 30
